# Render Deployment Blueprint for BADMINTON.AI
# Connect this GitHub repository directly to Render (https://dashboard.render.com).
# Supports both:
# 1. Native Python Web Service (free plan)
# 2. Docker Web Service via Dockerfile

services:
  - type: web
    name: badminton-ai-web
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_ENV
        value: production
      # Optional: set GEMINI_API_KEY and DATABASE_URL in the Render dashboard
