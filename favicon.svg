<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#040914" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Shuttlecock Feathers Vector -->
  <g filter="url(#glow)" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Feathers -->
    <path d="M18 12 L24 40" />
    <path d="M26 8 L29 40" />
    <path d="M32 6 L32 40" />
    <path d="M38 8 L35 40" />
    <path d="M46 12 L40 40" />
    
    <!-- Outer Arc Feather Shape -->
    <path d="M18 12 C 24 6, 40 6, 46 12" />
    <path d="M20 22 H 44" stroke-width="2"/>
    <path d="M22 31 H 42" stroke-width="2"/>
    
    <!-- Base Cork -->
    <path d="M24 40 C 24 54, 40 54, 40 40 Z" fill="url(#neonGrad)" stroke="none"/>
  </g>
</svg>
